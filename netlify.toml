[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Production: POST /api/submit-lead → app/api/submit-lead/route.ts (webhook + soft-fail Sheets).
# Netlify function kept for local/functions-only use — do not force-redirect in production
# or Sheets soft-fail in the Next route will be skipped.
# # AHREFS_WWW_APEX_REDIRECT — flatten https://www → apex (reduces Ahrefs redirect-chain)
[[redirects]]
  from = "/*"
  to = "https://taxexpertwitness.co.uk/:splat"
  status = 301
  force = true
  conditions = {Host = ["www.taxexpertwitness.co.uk"]}

[[redirects]]
#   from = "/api/submit-lead"
#   to = "/.netlify/functions/submit-lead"
#   status = 200
#   force = true

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain"
